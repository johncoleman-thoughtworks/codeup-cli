explanation: The default model names `"claude-sonnet-4-6"` and `"openai/gpt-4o-mini"` are baked in as compile-time constants. Model availability and versioning on hosted platforms change frequently; `claude-sonnet-4-6` is already a versioned slug that will become stale when Anthropic releases a newer Sonnet. Updating the default requires a rebuild and release of the binary rather than a configuration change.
suggestedRemediation: Externalise default model names to a configuration file or environment variables (e.g. `CODEUP_DEFAULT_ANTHROPIC_MODEL`, `CODEUP_DEFAULT_GH_MODELS_MODEL`) with these strings as fallback defaults. This lets operators or CI scripts update the default without a code change.
