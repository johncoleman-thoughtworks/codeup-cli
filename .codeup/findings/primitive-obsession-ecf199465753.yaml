explanation: Domain concepts like `category` (a pattern identifier), `file_path_pattern` (a glob expression), `dismissed_at`/`confirmed_at` (timestamps), and `dismissed_by`/`confirmed_by` (user identifiers) are all represented as raw `String`. There is no type distinction between a plain file path (`file_path`) and a glob pattern (`file_path_pattern`), meaning they can be silently swapped, compared directly, or passed to the wrong API without the compiler catching it. The `matches_glob` function already demonstrates this risk — it must explicitly handle both exact and pattern matching because the type carries no information about which it is.
suggestedRemediation: 'Introduce newtype wrappers: `GlobPattern(String)`, `FilePath(String)`, `Timestamp(String)`, `UserId(String)`. This makes the `matches_glob(file_path: &FilePath, pattern: &GlobPattern)` signature self-documenting and prevents callers from accidentally transposing arguments. The timestamp and user fields can share a type or be distinct depending on how they''re used downstream.'
