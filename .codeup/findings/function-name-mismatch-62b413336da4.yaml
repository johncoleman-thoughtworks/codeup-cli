explanation: '`analyze_file` does substantially more than analyze: it checks for binary content, enforces a size cap, computes a cache key, reads from and writes to the analysis cache, calls the LLM, validates LLM output, re-validates cached output, and constructs `Finding` domain objects. A caller reading `analyze_file(entry, text, ctx, neighbors, now)` would reasonably expect an analysis call; the cache read/write, binary detection, and multi-path revalidation are surprising side effects that the name does not advertise.'
suggestedRemediation: Rename to `analyze_file_with_cache` or split into a thin `analyze_file` that only calls the LLM and a higher-level `scan_file` (or `cached_analyze_file`) that handles the cache read/write, size guard, and binary guard. The name should reflect all significant side effects.
