explanation: The `from_cache` field in the returned `AnalyzeResult` is always set to `false` (line 143), even when findings actually came from cache. The comment acknowledges this ("findings round-tripped through cache when present"). This means the runner in `runner.rs` can never distinguish a live LLM response from a cache hit, so `llm_files_cached` will never be incremented — the counter that tracks cache hits is permanently zeroed. The misleading field value hides the provenance of findings from callers making operational decisions (logging, cost tracking).
suggestedRemediation: Track whether the cache was hit in a local `bool` and set `from_cache` accordingly. The runner already has `llm_files_cached` and `llm_files_scanned` counters that depend on this flag being correct.
