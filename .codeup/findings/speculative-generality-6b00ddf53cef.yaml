explanation: The `LLMClient` enum today has exactly two variants and the comment in the module doc explicitly calls this out ("there are only ever two providers"). The `provider()`, `model()`, and `analyze()` dispatch methods are all trivially delegating to concrete types. If a third provider truly never appears, this enum indirection adds a layer of boilerplate over direct use of the concrete types without delivering the extensibility benefit it implies. The module-doc comment "there are only ever two providers" is itself evidence this abstraction was shaped for the current two cases rather than emerging from a demonstrated need for a unified dispatch type.
suggestedRemediation: If a third provider is genuinely not anticipated, consider whether callers truly need the unified `LLMClient` type or whether passing the two concrete clients through a trait object (`dyn LlmAnalyze`) or simply accepting each concrete type at call sites would be clearer. If the enum stays, it is fine as-is — but document that adding a third provider is the trigger to revisit. At minimum, avoid expanding the enum's dispatch surface further until a real third case exists.
