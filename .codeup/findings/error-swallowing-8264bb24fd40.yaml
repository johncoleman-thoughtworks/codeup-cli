explanation: In `scan_workspace`, the walker result error is silently discarded with `Err(_) => continue`. Walk errors can include permission denied, I/O failures, or symlink cycles. Swallowing them means the caller receives a partial index with no indication that any files were missed. The same pattern repeats for `metadata()` errors at line 293 and `fs::read()` errors at line 298, all silently continuing without logging or propagating.
suggestedRemediation: At minimum, log the errors with `tracing::warn!` (as done in `collect_ignore_files` for ignore-file load failures) so operators can diagnose partial scans. For hard I/O errors from the walker itself, consider collecting them and returning them alongside the index, or surfacing them as a warning list on `ProjectIndex`.
