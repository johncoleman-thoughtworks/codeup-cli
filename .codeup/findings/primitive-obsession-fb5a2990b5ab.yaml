explanation: The constants `MAX_OUTPUT_TOKENS`, `MAX_FILE_CHARS`, `MAX_NEIGHBOR_CHARS`, and `MAX_NEIGHBORS` are bare primitives with no type wrapper or unit annotation. `MAX_FILE_CHARS` and `MAX_NEIGHBOR_CHARS` are measured in bytes/chars but their types are `usize` with no distinction — a caller mixing them up would pass silently. `MAX_OUTPUT_TOKENS` is a token count whereas the others are character counts; the same raw numeric type is overloaded across different units, making it easy to misuse them at call sites.
suggestedRemediation: Consider introducing unit-annotated newtypes (e.g. `CharLimit(usize)`, `TokenLimit(u32)`) or at minimum grouping these into a named config struct so that unit mismatches are caught by the type system rather than at runtime.
