explanation: Cache entries are read from disk and the findings inside them are used to drive security-relevant output (SARIF upload, `--fail-on` gate, stable-id generation) after only a structural re-validation pass (`revalidate_cached`). The revalidation correctly rejects unknown `category` values, but it still honours the full semantic content of every surviving field—`line`, `explanation`, `confidence`, `severity`—exactly as stored. Any principal who can write into `.codeup/cache/entries/` (a contributor whose PR is checked out by CI, or another process sharing the workspace) can plant a cache entry that causes the tool to emit fabricated findings or suppress real ones without going through the live LLM path. The `category` allowlist prevents path traversal into stable_id, but it does not prevent fabricated severity escalations or explanation injection.
suggestedRemediation: Either (a) store an HMAC/signature over the cache entry at write time (keyed to a secret derived from the workspace) and verify it on every read, failing closed on mismatch; or (b) treat cached findings as advisory only—re-emit them with `Status::Unconfirmed` and a flag indicating they came from cache, and refuse to let cached `severity` override the catalogue default without a live re-analysis. At minimum, document that the cache directory must be excluded from the PR-writable surface and enforce it via a `.codeup/cache/.gitignore` that is checked in under code-owner review (the existing auto-gitignore does not fully close this).
