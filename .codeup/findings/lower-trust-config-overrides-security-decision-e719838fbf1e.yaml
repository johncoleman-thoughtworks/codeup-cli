explanation: 'The `actions/checkout@v4` step in the `build` job uses `ref: ${{ inputs.tag || github.ref_name }}` where `inputs.tag` is a user-supplied `workflow_dispatch` string. This means the source tree that gets compiled and packaged into the signed release tarballs is determined by an unvalidated runtime input rather than the cryptographically-pinned event ref. A user with Actions write access can type any tag (including a tag pointing to a commit outside the main branch) and have the resulting binary silently included in a release, bypassing any branch protection on what code is deemed releasable.'
suggestedRemediation: Validate `inputs.tag` against an allowlist pattern and, separately, verify via `git log --oneline origin/main..HEAD` (or the GitHub API's `compareCommits`) that the resolved commit is reachable from the protected default branch before the build proceeds. Alternatively, use a required environment with deployment protection rules so the `workflow_dispatch` path requires manual approval before the build starts.
