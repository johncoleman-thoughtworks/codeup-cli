explanation: The `chrono_now_iso`, `unix_to_iso`, and `days_to_ymd` functions hand-roll ISO-8601 timestamp formatting from raw `SystemTime` using a manually implemented civil-date algorithm (Howard Hinnant's). The `time` or `chrono` crates (both already in common use in Rust ecosystems) handle this correctly and are battle-tested. The comment on line 280 even justifies avoiding `chrono` to reduce a dependency, but `chrono` is already an implicit dependency in other parts of the workspace given the toolchain.
suggestedRemediation: Use `chrono::Utc::now().format(...)` or the `time` crate's formatting support. Both handle leap years, edge cases, and DST correctly and are standard in the Rust ecosystem. The hand-rolled implementation is a maintenance burden and a subtle bug surface (e.g., edge cases around the epoch, leap-year transitions in `days_to_ymd`).
