explanation: 'The logic that builds a `ResolvedProvider` for Anthropic appears twice — once in the `ProviderSetting::Anthropic` arm (lines ~72–79) and again in the `ProviderSetting::Auto` arm (lines ~93–99). Identical patterns exist for GitHub Models (lines ~83–90 and ~102–108): compute the model string, construct the client, wrap in `ResolvedProvider`. The only difference between each pair is the `reason` string. If the client constructor signature or the struct fields change, both sites must be updated in lockstep, and they will silently drift.'
suggestedRemediation: 'Extract two small helpers, e.g. `make_anthropic_provider(key: AnthropicKey, model_override: Option<&str>, reason: &str) -> Result<ResolvedProvider>` and `make_github_provider(token: GitHubToken, model_override: Option<&str>, reason: &str) -> Result<ResolvedProvider>`. Each arm then delegates to the helper with only its specific `reason` string, eliminating the duplication.'
