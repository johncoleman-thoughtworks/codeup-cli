explanation: '`FileEntry.language` is a plain `String` holding values like `"typescript"`, `"rust"`, `"python"` etc. The set of valid values is fixed and known at compile time (the exhaustive `match` in `language_for_ext`), but callers everywhere — including `graph.rs` and `imports.rs` — match on this string with no compiler enforcement. A typo in any match arm silently falls through to a no-op branch.'
suggestedRemediation: Introduce a `Language` enum (or at least a newtype wrapping a validated string) and derive `Serialize`/`Deserialize` with the existing string representations. This gives exhaustiveness checking on match arms across `graph.rs` and `imports.rs`, and makes the contract explicit at the type level.
