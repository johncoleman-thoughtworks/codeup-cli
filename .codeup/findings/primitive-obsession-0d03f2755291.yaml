explanation: All node identifiers in `DependencyGraph` — including `edges`, `reverse`, and `unresolved` keys, plus the `Cycle.files` vec — are raw `String` values representing workspace-relative file paths. There is no `FilePath` newtype to distinguish a workspace-relative path from an absolute path, a raw import string, or an arbitrary string. Functions like `resolve_import` return `Option<String>` where the returned string is a workspace-relative path, indistinguishable at the type level from the `raw` import string passed in alongside it. This makes it easy to accidentally mix raw import strings with resolved paths in the graph data structures.
suggestedRemediation: 'Introduce a `WorkspacePath(String)` newtype (or a type alias with a constructor that enforces the invariant) for workspace-relative paths. Use this type as the key in `DependencyGraph` maps and as the element type in `Cycle.files`. Keep `raw_imports: Vec<String>` as raw strings, making the resolution boundary explicit at the type level.'
