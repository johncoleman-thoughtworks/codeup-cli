explanation: 'The `softprops/action-gh-release@v2` action is pinned to a floating mutable tag rather than an immutable commit SHA. A tag like `v2` can be force-pushed by the action''s maintainer (or a compromised maintainer account) to point to arbitrary code that runs with `contents: write` permissions — enough to overwrite release assets, tamper with release notes, or exfiltrate the `GITHUB_TOKEN`. The trust tier of the action''s tag registry (a third-party GitHub repo) is lower than the security decision it governs (publishing authenticated release artifacts under the project''s name with write permissions to repository contents).'
suggestedRemediation: Pin every third-party action to a full commit SHA (e.g. `softprops/action-gh-release@de2c0eb...`) rather than a mutable tag. Apply the same treatment to `actions/checkout@v4`, `dtolnay/rust-toolchain@stable`, `Swatinem/rust-cache@v2`, `actions/upload-artifact@v4`, and `actions/download-artifact@v4`. Use a tool like Dependabot's `github-actions` ecosystem or `pin-github-action` to automate SHA pinning and keep them updated.
