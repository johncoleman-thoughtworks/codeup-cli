explanation: The comment says "TS uses SHA-1 + 12 hex chars. SHA-256 + 12 is functionally equivalent for our id stability purposes (collision-resistant prefix)." However, the TS counterpart is described as using SHA-1, while this code uses SHA-256 — and the comment asserts these are "bit-for-bit equivalent" in the module doc at line 5. A 12-hex-char prefix from SHA-1 and a 12-hex-char prefix from SHA-256 are not the same bytes even for the same input, so the IDs will differ between implementations. The comment is misleading about the equivalence claim.
suggestedRemediation: Clarify the comment to say IDs are *stable within this implementation* but will not match the TS SHA-1-derived IDs. If cross-implementation ID stability is required, either match the TS algorithm (SHA-1, same prefix length) or document that the Rust and TS implementations produce different IDs intentionally.
