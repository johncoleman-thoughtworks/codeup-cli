explanation: The `chrono_now_iso`, `unix_to_iso`, and `days_to_ymd` functions hand-roll an ISO-8601 UTC timestamp formatter, including a full civil-date algorithm (Howard Hinnant's formula). The crate already depends on `chrono` (used elsewhere in the project) or could trivially add it; `chrono` or `time` would produce the same string with no risk of subtle calendar arithmetic bugs.
suggestedRemediation: Replace `chrono_now_iso`, `unix_to_iso`, and `days_to_ymd` with a single call to a time crate already in the dependency graph (e.g. `chrono::Utc::now().format("%Y-%m-%dT%H:%M:%S%.3fZ").to_string()`). This eliminates ~40 lines of hand-rolled calendar logic and removes the risk of off-by-one errors in the Gregorian algorithm.
