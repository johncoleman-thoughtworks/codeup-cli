explanation: All four parameters — `content_hash`, `catalogue_hash`, `model`, and `neighbors_key` — are bare `&str` values. They carry no type-level identity, so a caller that accidentally transposes `catalogue_hash` and `content_hash`, or passes the wrong hash string in any slot, compiles silently and produces a structurally valid but semantically wrong cache key. Because the cache key is a security/correctness-relevant identifier (a wrong key means stale results are silently served), the lack of distinct types is a real hazard rather than mere style.
suggestedRemediation: Introduce lightweight newtype wrappers (e.g. `ContentHash(&str)`, `CatalogueHash(&str)`, `ModelId(&str)`, `NeighborsKey(&str)`) or at minimum a `CacheKeyParts` struct so the compiler enforces the correct argument order and each field carries its intended meaning. This is especially low-cost in Rust where zero-overhead newtypes are idiomatic.
