explanation: The `now` field in `RunOptions` and the `scanned_at` field in `RunSummary` are raw `&str` / `String` values representing ISO-8601 timestamps. The type carries no invariant that the string is actually a valid timestamp, so callers can pass arbitrary strings (including empty ones) and the error surfaces only downstream in YAML/SARIF output or comparisons. The same pattern repeats throughout the codebase wherever `now` is threaded.
suggestedRemediation: Introduce a newtype `ScannedAt(String)` with a validated constructor, or use a proper datetime type (e.g. `chrono::DateTime<Utc>`) and serialize to ISO-8601 only at the output boundary. This makes the contract explicit and eliminates a class of subtle bugs.
