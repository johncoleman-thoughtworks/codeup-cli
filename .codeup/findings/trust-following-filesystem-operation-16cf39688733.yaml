explanation: The `put` method writes cache entry files under `self.root.join(ENTRIES_REL)` using `std::fs::create_dir_all`
  and `std::fs::write` with no symlink checks. Compare this to `store.rs`'s `safe_write_yaml`, which uses
  `assert_no_symlink_ancestors`, opens the temp file with `O_NOFOLLOW`, and performs an atomic rename.
  An attacker who can plant a symlink anywhere under `.codeup/cache/` (e.g. by checking out a crafted
  PR that the CI runner's workspace contains) can redirect a cache write to an arbitrary filesystem path
  with the privileges of the scanning process.
suggestedRemediation: 'Apply the same hardening used in `store.rs`: use a `safe_create_dir_all` equivalent
  that calls `assert_no_symlink_ancestors` before `create_dir_all`, write to a process-unique temp file
  opened with `O_NOFOLLOW` (via `OpenOptions::custom_flags(libc::O_NOFOLLOW)`), and atomically rename
  into the final path after checking that the destination is not already a symlink.'
