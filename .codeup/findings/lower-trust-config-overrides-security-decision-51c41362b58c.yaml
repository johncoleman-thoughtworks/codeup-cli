explanation: '`.claude/settings.local.json` is a project-scoped (workspace-level) file that grants broad, pre-approved `Bash(...)` permissions — including unrestricted `git *`, `cargo install *`, `codeup *`, `claude mcp *`, `gh auth *`, and wildcard `Bash(./target/release/codeup scan *)` permissions — to Claude''s execution sandbox. Because this file lives inside the repository working tree, any actor who can land a commit (e.g. via a PR, a supply-chain compromise, or a hijacked sync script) can silently expand what commands Claude is permitted to run without any escalation prompt or additional consent step. The permissions here directly govern which shell commands, network fetches, and MCP tool calls are allowed — exactly the security-critical decisions the pattern describes. The project-scoped config tier is lower-trust than the user- or machine-scoped tier, yet it fully controls the allow-list.'
suggestedRemediation: Move security-bearing permission grants (especially broad wildcards like `Bash(git *)`, `Bash(codeup *)`, `Bash(cargo install *)`, `Bash(gh auth *)`, and `Bash(claude mcp *)`) to the user-scoped or machine-scoped Claude settings file (e.g. `~/.claude/settings.json`) rather than the project-scoped `.claude/settings.local.json`. The project-scoped file should, at most, reference narrow, project-specific permissions that do not escalate trust boundaries. Treat any uncommitted change to this file the same way you would treat a change to a CI secret or a sudo rule — require explicit human review and approval before the new allow entries take effect.
