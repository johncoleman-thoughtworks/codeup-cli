explanation: The `install_from_source` function performs a `git clone` of the repository and then executes
  `cargo build` against whatever code is present in the cloned working tree. There is no verification
  that the cloned commit matches a signed tag or a known-good commit hash. An attacker who can influence
  the repository (e.g. a compromised GitHub account, a force-pushed branch, or a DNS/BGP hijack during
  the clone) can inject arbitrary Rust code that will be compiled and installed with user privileges.
  The `--depth 1` flag fetches only the tip, bypassing any signed-tag history that could be checked.
suggestedRemediation: After cloning, verify the HEAD commit against a GPG-signed tag using `git tag -v
  "$VERSION"` or check that the commit SHA matches a value pinned in the installer. Prefer verifying a
  signed release tag over a branch tip. For the "latest" path, resolve the latest signed tag via a verified
  API call and then check the tag signature rather than blindly cloning HEAD.
