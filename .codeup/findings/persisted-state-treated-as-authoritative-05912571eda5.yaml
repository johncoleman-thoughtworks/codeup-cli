explanation: 'The `schemaVersion` field is read directly from the raw YAML value without any cross-check that the value was produced by a trusted source. The caller passes in `raw: Value` — a deserialized blob that could have come from a user-writable file in the repository (e.g., `.codeup/` dismissals, findings, or exemplars). A malicious YAML file could declare an arbitrarily high or low `schemaVersion` to skip migrations (potentially hiding injected fields that would be stripped by a migration) or to force the `SchemaTooNew` error path. There is no attestation that the stored version number matches what the current process actually last wrote.'
suggestedRemediation: 'Treat the on-disk `schemaVersion` as untrusted data: clamp it to the range `[1, current_version]` and log a warning when it is missing or out of range rather than silently defaulting to 1. For security-bearing persisted files (dismissals, findings), consider storing a MAC over the version + content fields so the loader can detect tampering before acting on the version claim.'
