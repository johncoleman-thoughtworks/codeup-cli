explanation: The script resolves the `codeup` binary by first checking `PATH` (an externally-supplied lookup) and then falling back to a local release build at `./target/release/codeup`. In either case the binary is executed without any integrity check — no checksum comparison, no signature verification, and no pinned hash. An attacker who can place a malicious `codeup` binary earlier on `PATH` (or tamper with the release build artifact) will have it executed against the codebase with the caller's privileges and a live `ANTHROPIC_API_KEY` in the environment.
suggestedRemediation: Pin the expected binary by recording and verifying a SHA-256 checksum of the known-good `codeup` release before executing it. Alternatively, always build from a pinned, verified source commit (using `--locked` and a commit-hash check) rather than trusting whatever binary is first on PATH. At minimum, document that the caller is responsible for verifying the binary provenance before invoking this script in CI.
