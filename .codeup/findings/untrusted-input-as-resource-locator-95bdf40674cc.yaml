explanation: At line 211, `std::fs::read(opts.root.join(&entry.path))` joins the workspace root with `entry.path`, which originates from `scan_workspace` traversal of the filesystem. While scan results come from the local filesystem rather than a network request, in a CI context (e.g., scanning a PR checkout) the files themselves were authored by an untrusted contributor. More critically, at line 274 in `gather_neighbors`, `std::fs::read(root.join(&path))` uses neighbor paths that were resolved from the dependency graph built from file content. If a source file contains import statements that resolve to paths with traversal components (e.g., `../../etc/passwd`), and the graph builder does not normalize them, the `root.join(path)` could escape the workspace. There is no post-join containment check comparing the resolved path against `opts.root`.
suggestedRemediation: After computing the joined path, canonicalize it and verify it is still prefixed by the canonicalized `opts.root` before reading. Reject any path that does not stay within the workspace root. This same check should be applied in both the main file-reading loop and in `gather_neighbors`.
