explanation: 'The `Finding` struct is deserialized directly from `.codeup/findings/*.yaml` on disk (as described in the module doc comment), and security-relevant fields such as `status` (including `Dismissed`), `severity`, `priority`, and `confidence` are loaded verbatim from the file with no re-attestation. The `id` field is also taken from the record itself rather than derived from the record''s content, meaning a planted file with `status: dismissed` and a predictable `id` would be merged as authoritative by any consumer that keys on these fields. The persistent location is within the repository checkout, meaning a contributor PR can author or overwrite these files.'
suggestedRemediation: 'Treat `status`, `severity`, and `priority` fields loaded from disk as untrusted on read. Either (a) maintain dismissal/approval state in a separate ACL-restricted store outside the PR surface rather than inside `.codeup/findings/`, (b) attach a signature or HMAC to each record computed at write time and verified at read time, or (c) reset `status` to `Unconfirmed` on load and require a trusted runtime source to reassert `Dismissed`/`Confirmed`. At minimum, never let a freshly-detected finding be suppressed solely because a file on disk claims `status: dismissed`.'
