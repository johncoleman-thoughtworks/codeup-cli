explanation: '`CacheEntry.analyzed_at` and `ReportedFinding.severity` are raw `String` fields with no type-level invariant. `analyzed_at` is expected to be an ISO-8601 timestamp but is passed in from the caller as an arbitrary `String` (see `put`''s `now: String` parameter). `severity` is expected to be one of `"low" | "medium" | "high"` but is stored and serialized as a plain string — the type carries no guarantee. This is especially visible since the neighbor `codeup_core::schema` already defines a typed `Severity` enum.'
suggestedRemediation: Use the existing `codeup_core::schema::Severity` enum for `ReportedFinding::severity` instead of `String`. For `analyzed_at`, either accept it as a typed timestamp type or at least validate the format at construction. This removes the duplicate string-validation logic in `validate_reported` and `revalidate_cached` in `analyzer.rs`.
