explanation: The checksum sidecar (`.sha256`) is fetched from the same host and the same release directory as the artifact itself. If the release host is compromised or a MITM substitutes the artifact, the attacker can trivially substitute the matching `.sha256` file at the same location. A checksum that travels through the same channel as the artifact provides no independent verification — only a checksum published via a separate, out-of-band channel (e.g. pinned in the repository, signed with a GPG/Sigstore key, or fetched from a different origin) can actually detect substitution. The script even explicitly continues without verification when the sidecar is missing (`log "(no checksum sidecar; skipping verification)"`), making non-verification the default fallback.
suggestedRemediation: Publish a detached GPG or Sigstore/cosign signature alongside releases and verify it with a pinned public key baked into the installer. At minimum, embed expected checksums as constants in the installer script (updated at release time via CI) rather than fetching them from the same host as the artifact. Never silently continue when the verification file is absent — fail closed instead.
