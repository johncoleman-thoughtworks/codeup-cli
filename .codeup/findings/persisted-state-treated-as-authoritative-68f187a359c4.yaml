explanation: 'The cache is keyed by a hash of content, catalogue, model, and neighbor fingerprints — but the `from_cache: false` field on line 155 is hardcoded regardless of whether the result actually came from cache. The `runner.rs` caller reads `from_cache` to increment `llm_files_cached`, so the counter will always stay zero even when every result was a cache hit. The cache is being used for the security re-validation path (correctly), but the provenance metadata flowing out is wrong.'
suggestedRemediation: Track whether the result came from cache in a local boolean (e.g. `let from_cache = ctx.cache.get(&cache_key).is_some()`) and use that in the returned `AnalyzeResult`. The comment on line 155 acknowledges this is wrong; the fix is to record the boolean before the branch and thread it through.
