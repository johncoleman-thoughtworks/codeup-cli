explanation: The script fetches a YAML file from a raw GitHub URL (line 21) constructed from a user-supplied
  or defaulted ref, writes it to a temp file, and then moves it directly into the repository (line 30)
  after only a superficial content sniff (`grep -q "schemaVersion"`). There is no checksum comparison
  against a value published through a separate channel, no GPG/sigstore signature verification, and no
  allowlist enforcement beyond the hardcoded hostname. A compromise of the GitHub account, the repository,
  the CDN edge, or a transport-layer MITM (including a corporate proxy that terminates TLS) can substitute
  a malicious catalogue that will subsequently be shipped inside this repo and consumed by all downstream
  users.
suggestedRemediation: 'Pin integrity separately from the artifact: after `curl`, compute a SHA-256 of
  the downloaded file and compare it against a known-good digest stored in the repository itself (e.g.
  `resources/default.yaml.sha256`) that was committed via a trusted out-of-band process. Alternatively,
  require a detached GPG or sigstore signature from the upstream publisher and verify it before `mv`.
  If the canonical source is GitHub, use the GitHub API with authentication to fetch a commit-level blob
  SHA for cross-channel validation. Never rely solely on HTTPS transport security as the integrity guarantee.'
