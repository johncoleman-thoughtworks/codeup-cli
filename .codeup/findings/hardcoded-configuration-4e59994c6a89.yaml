explanation: The `TOOL_INFO_URI` constant contains a hardcoded GitHub repository URL (`https://github.com/johncoleman-thoughtworks/codeup-cli`). This is an environment-specific value (repository location/identity) baked directly into source code. If the repository is ever renamed, transferred, or mirrored, this constant will silently serve a stale or broken URL in all SARIF outputs without any rebuild signal beyond a string literal change.
suggestedRemediation: Drive this from `CARGO_PKG_HOMEPAGE` or `CARGO_PKG_REPOSITORY` (set in `Cargo.toml`) via `env!()`, the same way `version` is already sourced via `env!("CARGO_PKG_VERSION")`. That makes the URL a single, authoritative metadata field rather than a separate literal.
