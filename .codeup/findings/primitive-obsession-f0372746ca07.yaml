explanation: The `FindingLocation.file` field is a plain `String` representing a filesystem path. Paths have well-known invariants (must be non-empty, must not contain null bytes, should be relative vs. absolute), but using a raw `String` lets any string pass unchecked. The neighbor `knowledge.rs` and `intent.rs` also accept file paths as `&str`/`String`, so path-handling bugs (e.g., absolute paths, path traversal) can silently enter the system through this field after deserialization from untrusted YAML.
suggestedRemediation: Introduce a `FilePath` newtype wrapping `String` (or `Utf8PathBuf` from the `camino` crate) that validates the value on construction — non-empty, no null bytes, relative only. This gives a single place to enforce invariants and makes API boundaries self-documenting.
