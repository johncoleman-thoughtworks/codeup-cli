explanation: Multiple `Err(_) => continue` arms inside `scan_workspace` silently swallow errors from `result` (walker errors), `strip_prefix`, `dent.metadata()`, and `std::fs::read`. In particular, a failure to read a file (permissions error, I/O error, broken symlink) is silently skipped — the caller receives a `ProjectIndex` that appears complete but may be missing files, with no indication that anything went wrong. The severity is softened slightly because the walker is best-effort by design, but there is no warning/tracing call on these paths.
suggestedRemediation: At minimum, add `tracing::warn!` calls on the error arms that are not purely "not a file" checks — especially the `std::fs::read` failure and `dent.metadata()` failure — so operators can detect partial scans. Consider propagating critical walker errors rather than continuing past them.
