explanation: 'The LLM pass nests three levels of control flow inside `run`: `if !opts.deterministic_only` → `if let Some(client)` → `for entry in &supported` → `match analyze_file(...).await` → nested `if let Some(reason)` / `if from_cache`. The reader must track which counter increments happen under which combination of conditions, and the error arm is an implicit swallow (log + continue). This compound branching and mixed concerns (file I/O, cache counters, per-file error handling, store writes) make the function hard to reason about in a single pass.'
suggestedRemediation: Extract the per-file processing into a separate async function `analyze_one(entry, root, client, ...) -> Result<FileScanOutcome>` that returns a typed enum (Skipped(reason), Cached(findings), Fresh(findings)) and let the outer loop match on that outcome cleanly. This also makes the error path explicit.
