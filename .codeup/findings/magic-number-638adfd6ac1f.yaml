suggestedRemediation: 'Define `const HASH_PREFIX_LEN: usize = 16;` in a shared location (e.g. a `hashing` utility module or in `lib.rs`) and reference it in all three sites (`catalogue.rs`, `knowledge.rs`, `quality.rs`). This makes intent explicit and ensures a single change point.'
