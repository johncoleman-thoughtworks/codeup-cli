explanation: The prebuilt binary install path has an explicit fallback to `install_from_source` with the message "Prebuilt install failed — falling back to source build." This fallback is triggered silently on any network or extraction error, and the source build path has no integrity verification whatsoever (see the git-clone finding above). An attacker who can make the prebuilt download fail (e.g. by blocking the GitHub releases CDN or returning a bad tarball) can force every user into the unverified source path, which then clones and compiles whatever is at the tip of the repository branch.
suggestedRemediation: Remove the automatic silent fallback to source build, or require explicit user opt-in via `--from-source`. If a fallback is kept, require the same level of integrity verification (signed tag check) on the source path before compiling and installing.
