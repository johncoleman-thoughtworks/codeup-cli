explanation: 'The `load_catalogue` function accepts `overrides: &[CataloguePattern]` — patterns sourced from `.codeup/knowledge/patterns.yaml`, a file that lives in the project/workspace directory and is therefore writable by whoever controls the repo. These overrides are merged directly onto the default catalogue with no integrity check, signature verification, or ACL-restricted source. A contributor whose PR is checked out by CI can ship a `patterns.yaml` that overrides any pattern''s `hint`, `default_severity`, or `id`, and the merged catalogue will be treated as authoritative for all subsequent analysis of that run, including suppression decisions driven by pattern ids. The `hash` field is recomputed from the override content itself, so a planted override will produce a fresh but legitimate-looking hash and bypass any cache that uses it as a trust signal.'
suggestedRemediation: 'Treat workspace overrides as lower-trust data: (a) restrict which fields overrides may change — e.g. allow `hint` and `name` but not `id` or `default_severity`; (b) validate that an override''s `id` already exists in the base catalogue before accepting it (preventing pattern injection); or (c) move the override file to an ACL-gated path (outside the PR surface) and gate changes on code-owner approval. At minimum, log a warning when an override changes a security-relevant field like severity.'
