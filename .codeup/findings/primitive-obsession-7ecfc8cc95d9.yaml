explanation: '`CacheEntry::analyzed_at` and `ReportedFinding::severity` are both raw `String` values representing domain concepts with restricted value sets: `analyzed_at` is an ISO-8601 timestamp and `severity` is an enum (`"low"`, `"medium"`, `"high"`). Using strings for these makes them easy to corrupt in transit (a typo in severity, a malformed timestamp) and forces every consumer to re-parse or re-validate the strings rather than relying on the type system.'
suggestedRemediation: Use a shared `Severity` enum (already present in `codeup_core::schema`) for `ReportedFinding::severity`, and consider a newtype or `chrono::DateTime` for `analyzed_at`. This lets serde enforce invariants at deserialization time rather than requiring manual checks in `revalidate_cached`.
