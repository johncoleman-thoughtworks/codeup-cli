explanation: '`put()` uses `std::fs::create_dir_all` and `std::fs::write` with default link-following semantics — no symlink checks are performed on the cache directory path or the final file path. The neighbor `store.rs` uses an elaborate `safe_write_yaml` / `assert_no_symlink_ancestors` / `O_NOFOLLOW` approach to prevent symlink-based path traversal, but `AnalysisCache::put` omits all of these protections. A malicious actor who can plant a symlink at `.codeup/cache/entries/` (e.g. via a checked-out PR) can redirect cache writes to arbitrary filesystem locations.'
suggestedRemediation: 'Apply the same `safe_create_dir_all` / `safe_write_yaml` pattern already implemented in `store.rs` to this cache write path. At minimum: lstat each path component and refuse if any is a symlink; use `O_NOFOLLOW` when opening the final file for writing; write to a temp file and atomically rename, as `store.rs` does.'
