explanation: 'The `find_cycles` function is a large, deeply interleaved mix of concerns: initialization of multiple mutable data structures, an outer loop over all nodes, an inner while-loop mutating work frames, successor-processing branches with early `continue`, lowlink propagation, SCC root detection, component extraction, and self-loop special-casing — all woven together in roughly 90 lines. The reader must hold Tarjan''s three-phase invariant (discovery, backtrack-propagation, pop-component) in their head simultaneously while tracking the iterative frame simulation of what was originally recursive. One cannot summarise what the function does at a glance without re-reading the entire body.'
suggestedRemediation: 'Extract at least three helpers: (1) `push_frame` — initialise index/lowlink/on_stack and push a new Frame; (2) `process_successor` — handle the not-yet-visited vs. already-on-stack branches and return whether a new frame was pushed; (3) `emit_component` — pop the Tarjan stack, build the component, and push to `cycles`. The outer `find_cycles` then reads as a clean orchestration loop over those verbs.'
