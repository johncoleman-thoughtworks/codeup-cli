explanation: The `Err(e)` arm of the `analyze_file` match logs the error with `tracing::warn!` and then falls through to the next iteration, effectively silently continuing the scan. The caller (and CI pipeline using `--fail-on`) receives no indication that some files were not analyzed due to errors, which could mask authentication failures, rate-limit exhaustion, or schema decode errors across many files.
suggestedRemediation: Track a separate `llm_files_errored` counter (already has `skipped` precedent) and surface it in `RunSummary`. Consider returning a non-zero exit or at least a structured warning when the error rate exceeds a threshold, so CI can distinguish "no findings" from "analysis failed silently on 50 files".
