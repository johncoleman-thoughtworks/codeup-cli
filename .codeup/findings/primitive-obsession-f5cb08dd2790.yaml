explanation: The `ScanMeta` struct holds `scanned_at` as a raw `String` rather than a typed timestamp. The field represents a specific ISO-8601 datetime value, but nothing prevents callers from passing arbitrary strings. The test at line 176 already shows the literal `"2026-06-21T14:03:00.000Z"` being assigned directly, and main.rs passes `summary.scanned_at` (also a plain `String`) — the type carries no invariant that the value is a valid datetime.
suggestedRemediation: Use a typed timestamp (e.g. `chrono::DateTime<Utc>` or a newtype `struct ScannedAt(String)` with a validated constructor) so that the contract is enforced at the boundary rather than by convention.
