explanation: The `load_knowledge` function reads `dismissals.yaml` and `exemplars.yaml` from disk and returns their entries without any integrity verification — no HMAC, no signature, no cross-check that the dismissal records were written by the current trusted process. A contributor who can place or modify `.codeup/knowledge/dismissals.yaml` in the repository (e.g. via a PR) can plant dismissal entries that will silently suppress real findings. The `runner.rs` caller does drop entries with unknown categories, but any entry naming a valid catalogue category and a valid file glob pattern passes straight through. Unlike findings (which do re-check `stable_id`), dismissals carry no self-consistency property that can be re-derived from current scan data.
suggestedRemediation: 'Treat persisted dismissals as "pending confirmation" rather than authoritative suppressions. Options: (a) require dismissal records to carry a signature from a trusted key that CI verifies, (b) move `dismissals.yaml` outside the PR surface (e.g. a branch the PR author cannot write to, gated by CODEOWNERS), or (c) at minimum warn loudly in CI when `dismissals.yaml` was modified by the PR under review, so a human reviewer must explicitly approve the suppression change.'
