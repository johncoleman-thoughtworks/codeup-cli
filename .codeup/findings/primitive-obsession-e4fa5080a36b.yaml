explanation: The `LayerRule` struct uses plain `String` fields for `layer` and `match`, both of which represent distinct domain concepts — a layer name and a glob pattern respectively. The pattern string is given special semantics (trailing-slash expansion, `literal_separator` glob matching) that are not captured at the type level, so any `String` can be erroneously used as a `LayerPattern` or vice versa. A caller building a `LayerRule` by hand has no type-level guidance that `r#match` must be a valid glob.
suggestedRemediation: Introduce a `GlobPattern(String)` newtype (or a pre-compiled `CompiledGlob` that validates on construction) to make the domain intent clear and prevent misuse. Similarly, a `LayerName(String)` newtype would prevent accidental mixing of layer names with arbitrary strings in the `cannot_depend_on` list.
