explanation: 'The `load` function resets `Dismissed` and `Fixed` statuses on load specifically to prevent a planted dismissal from suppressing a re-detected finding. However, `Unconfirmed` and `Confirmed` statuses are still honoured from disk as-is. A malicious actor who can write to `.codeup/findings/` could plant a record with `status: confirmed` and a crafted `id`/`location` that would pass the `stable_id` check (same file, category, line) to pre-seed a finding as `Confirmed` before the LLM even runs, potentially amplifying its apparent trust level or bypassing workflows that only act on `Unconfirmed` findings.'
suggestedRemediation: 'Extend the reset logic to also reset `Confirmed` back to `Unconfirmed` on load for the same reason: persisted security state (including confirmation) should not be honoured without re-attestation. Only status transitions performed interactively through a trusted surface should persist across reloads.'
