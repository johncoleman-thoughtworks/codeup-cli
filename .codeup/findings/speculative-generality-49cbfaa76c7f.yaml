explanation: The `LLMClient` enum acts as a hand-rolled trait object with a single method (`analyze`) that dispatches to two implementations. The module comment itself acknowledges this is specifically because "there are only ever two providers." While the enum-dispatch rationale (avoiding async-trait-object boilerplate) is pragmatic, the `provider()` and `model()` accessor methods on the enum are extra surface area that only makes sense if callers actually branch on provider identity at runtime — which is a form of speculative generality if those accessors aren't needed for core behavior. If new providers are added, each new arm must be added to every `match` in this enum, making it a shotgun-surgery target.
suggestedRemediation: If `provider()` and `model()` are only used for logging/display purposes, consider whether they belong on the client at all or should be part of the `ResolvedProvider` struct (which already carries a `reason` string). If a third provider is ever added, evaluate whether the `async-trait` crate (or Rust's native async trait stabilization) has matured enough to warrant a trait-based dispatch instead.
