explanation: 'DismissalEntry and ExemplarEntry are deserialized from on-disk YAML files where the security-relevant
  fields — `category`, `file_path_pattern`, `rationale`, `dismissed_by`, `confirmed_by`, and `status`
  (the very existence of an entry represents a dismissal/confirmation decision) — are taken as authoritative
  without any re-attestation. The `relevant_for` function then directly uses these entries to drive prompt-level
  suppression logic: if a matching dismissal exists, the LLM is instructed to not report that finding
  category. A hostile actor who can write into `.codeup/knowledge/dismissals.yaml` (e.g. a contributor
  whose PR is checked out by CI) can plant a dismissal entry suppressing any category across any glob
  pattern, bypassing the detection gate entirely.'
suggestedRemediation: Treat persisted dismissal/exemplar records as requiring re-attestation for their
  security-bearing fields. At minimum, store dismissals outside the PR-writable surface (behind a code-owner
  gate), or require an HMAC/signature on each entry verified against a pinned key at load time. Never
  let a self-described `dismissed_by` field suffice as proof of authorization — verify against a trusted
  source (e.g. GitHub review audit log, signed policy file) before honoring the suppression.
