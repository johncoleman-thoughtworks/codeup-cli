explanation: '`analyze_file` takes 5 parameters: `entry`, `text`, `ctx`, `neighbors`, and `now`. While `ctx` bundles several dependencies, `text` and `now` are loose primitives alongside a rich context object. `text` in particular could reasonably belong on `entry` (or a richer `AnalyzeInput` struct). The split between what''s in `AnalyzeContext` and what''s passed separately is not principled, making the function signature harder to evolve without breaking all callers.'
suggestedRemediation: Introduce an `AnalyzeInput` struct that bundles `entry`, `text`, and `neighbors` together, leaving `ctx` and `now` as orthogonal concerns, or add `text` and `neighbors` into a richer entry wrapper so the function signature collapses to two or three arguments.
