explanation: 'The `tag_name` passed to `softprops/action-gh-release@v2` is resolved as `inputs.tag || github.ref_name`. The `inputs.tag` value is a free-form `workflow_dispatch` string input — any user with `Actions: write` permission on the repository can supply an arbitrary tag name and cause the job to attach freshly-built release assets (including the installer script) to any pre-existing GitHub Release. This means a lower-trust runtime input (a manually typed string) governs which release record receives the published binaries — a security-critical publishing decision. Combined with `permissions: contents: write` at the workflow level, a bad actor with repo write access could overwrite assets on a previously-published, trusted release with tampered binaries, or publish assets that were built from a different ref than the one the release was created from.'
suggestedRemediation: Restrict the `tag_name` to the system-controlled context value when possible. On `push` events the tag is already implicit in `github.ref_name`; for `workflow_dispatch`, validate that `inputs.tag` matches an expected pattern (e.g. `^v[0-9]+\.[0-9]+\.[0-9]+$`) and — critically — verify that the tag resolves to a commit on the protected main branch before proceeding. Consider moving the `workflow_dispatch` path to a separate, more-restricted workflow, or adding a required review / environment protection rule on a named environment that gate-keeps the release job, so no single user can silently redirect where built artifacts land.
